<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Anita Brau portfolio preview</title>
  <desc id="desc">Portfolio preview for Anita Brau, Italian AI linguistic evaluation and localization QA.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#18263F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#F6C58F"/>
      <stop offset="100%" stop-color="#D9784A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1000" cy="130" r="180" fill="#13233D" opacity="0.8"/>
  <circle cx="1040" cy="190" r="120" fill="#1D3452" opacity="0.5"/>
  <circle cx="190" cy="520" r="250" fill="#0F1F36" opacity="0.9"/>

  <rect x="90" y="80" width="180" height="52" rx="26" fill="rgba(255,255,255,0.08)"/>
  <text x="130" y="114" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#FCE6D0" letter-spacing="3">ANITA BRAU</text>

  <text x="90" y="220" font-family="Georgia, 'Times New Roman', serif" font-size="68" fill="#F3F5F8">Italian language</text>
  <text x="90" y="292" font-family="Georgia, 'Times New Roman', serif" font-size="68" fill="#F3F5F8">quality, made clear.</text>

  <text x="90" y="360" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#D7DEE9">AI Linguistic Evaluation • Localization QA</text>
  <text x="90" y="400" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#D7DEE9">Speech-quality review • User trust</text>

  <rect x="90" y="470" width="250" height="64" rx="32" fill="url(#accent)"/>
  <text x="140" y="512" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0B1020">Portfolio</text>

  <g opacity="0.9">
    <circle cx="845" cy="430" r="5" fill="#F6C58F"/>
    <circle cx="880" cy="430" r="5" fill="#F6C58F"/>
    <circle cx="915" cy="430" r="5" fill="#F6C58F"/>
    <circle cx="950" cy="430" r="5" fill="#F6C58F"/>
    <circle cx="985" cy="430" r="5" fill="#F6C58F"/>
